<text x="505" y="494" text-anchor="middle" font-weight="bold">ALIMENTATION</text>
<text x="505" y="516" text-anchor="middle" fill="#555">Batterie 2S 7,4 V → interrupteur → VIN du Nano + VM du TB6612 · régulateur du Nano → rail 3V3 (capteurs, LED, WS2812B) · masse commune</text>

<g font-size="12" fill="#333">
<rect x="40" y="566" width="16" height="12" fill="#e8f6f0" stroke="#1e8a5a"/><text x="62" y="577">Entrée numérique</text>
<rect x="190" y="566" width="16" height="12" fill="#fdf3e1" stroke="#b9770e"/><text x="212" y="577">Entrée analogique</text>
<rect x="345" y="566" width="16" height="12" fill="#eeedfe" stroke="#534ab7"/><text x="367" y="577">Traitement logiciel</text>
<rect x="505" y="566" width="16" height="12" fill="#faece7" stroke="#d85a30"/><text x="527" y="577">Sortie / rétroaction</text>
<text x="40" y="608">Les sorties dépendent de l'interprétation des capteurs (position de la ligne, distance, charge) et du mode courant : aucune entrée n'est recopiée directement vers une sortie.</text>
</g>
