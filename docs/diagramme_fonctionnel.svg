<text x="505" y="192" text-anchor="middle" font-weight="bold">Calcul de la correction</text><text x="505" y="211" text-anchor="middle" fill="#555" font-size="12">position pondérée → écart G/D</text>
<text x="505" y="258" text-anchor="middle" font-weight="bold">Machine à états</text>
