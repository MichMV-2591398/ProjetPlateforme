<rect width="1110" height="800" fill="#ffffff"/>
<text x="40" y="34" font-size="18" font-weight="bold" fill="#1a1a1a">Fast line tracker - schéma de câblage</text>
<text x="40" y="56" fill="#555">420-314 Épreuve finale - Arduino Nano ESP32 (ABX00083) - alimentation par batterie externe USB</text>

