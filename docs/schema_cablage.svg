<text x="40" y="763">Toutes les masses (batterie, Nano, TB6612, capteurs, WS2812, HC-SR04) sont reliées au rail GND commun.</text>
<text x="40" y="781">Recommandé : 470 µF entre VM et GND du TB6612 et 0,1 µF aux bornes de chaque moteur (évite les redémarrages de l'ESP32).</text>
