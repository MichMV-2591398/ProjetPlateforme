<text x="350" y="600" fill="#1f6fb2" text-anchor="end">SDA</text><text x="668" y="600" fill="#1f6fb2">SCL</text>
<rect x="400" y="605" width="220" height="70" rx="8" fill="#e6f1fb" stroke="#1f6fb2" stroke-width="1.5"/>
<text x="510" y="629" text-anchor="middle" font-weight="bold">Matrice DEL 8x8 (HT16K33)</text><text x="510" y="649" text-anchor="middle" fill="#555">I2C 0x70 · VCC 3V3 (ou 5 V) · GND</text><text x="510" y="666" text-anchor="middle" fill="#555" font-size="11">composant nouveau</text>

<g font-size="12">
<line x1="40" y1="725" x2="70" y2="725" stroke="#c0392b" stroke-width="2"/><text x="78" y="729">Alimentation</text>
<line x1="180" y1="725" x2="210" y2="725" stroke="#333" stroke-width="1.3"/><text x="218" y="729">Signal numérique / PWM</text>
<line x1="390" y1="725" x2="420" y2="725" stroke="#b9770e" stroke-width="1.5"/><text x="428" y="729">Signal analogique (ADC)</text>
<line x1="600" y1="725" x2="630" y2="725" stroke="#1f6fb2" stroke-width="1.6"/><text x="638" y="729">Bus I2C</text>
<text x="40" y="755">Toutes les masses (Nano, TB6612, capteurs, matrice 8x8, HC-SR04, LED, bouton, potentiomètre) sont reliées au rail GND commun.</text>
<text x="40" y="775">Recommandé : 470 µF entre VM et GND du TB6612 et 0,1 µF aux bornes de chaque moteur. Chaque couleur de la LED RVB passe par sa résistance.</text>
</g>
