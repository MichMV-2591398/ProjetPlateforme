<rect x="720" y="482" width="200" height="54" rx="6" fill="#fdf3e1" stroke="#b9770e"/><text x="820" y="500" text-anchor="middle">LED RVB (cathode → GND)</text><text x="820" y="517" text-anchor="middle" font-size="11" fill="#555">B: D6 (100 Ω) · R: D1 (220 Ω)</text><text x="820" y="531" text-anchor="middle" font-size="11" fill="#555">G: A7 (100 Ω)</text>

